[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-orrery-core"
version = "0.1.17"
description = "Platform-neutral schemas, manifests, compatibility rules, and authority templates for Orrery"
requires-python = ">=3.10"

[tool.setuptools.package-data]
project_orrery_core = [
  "data/*.json",
  "schema/*.json",
  "templates/authority/*",
  "templates/authority/.gitignore",
  "templates/authority/**/*"
]

[tool.setuptools.packages.find]
where = ["src"]
