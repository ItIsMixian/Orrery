[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-orrery-cli"
version = "0.1.22"
description = "Platform-neutral command line interface for Orrery"
requires-python = ">=3.10"
dependencies = [
  "project-orrery-core==0.1.18",
  "project-orrery-observatory==0.1.0"
]

[project.scripts]
project-orrery = "project_orrery_cli.__main__:main"
project-orrery-scaffold = "project_orrery_cli.scaffold:main"
project-orrery-validate = "project_orrery_cli.validate:main"
project-orrery-check-update = "project_orrery_cli.update:main"
project-orrery-migrate-authority-model = "project_orrery_cli.authority_migrate:main"
project-orrery-restore-authority-model = "project_orrery_cli.authority_restore:main"
project-orrery-collaboration-contract = "project_orrery_cli.collaboration_contract:main"
project-orrery-worktree = "project_orrery_cli.worktree:main"
project-orrery-integrate = "project_orrery_cli.integration:main"
project-orrery-review = "project_orrery_cli.review:main"
project-orrery-team = "project_orrery_cli.team:main"
project-orrery-maintenance = "project_orrery_cli.maintenance:main"
project-orrery-relations = "project_orrery_cli.workstream_relations:main"

[tool.setuptools.packages.find]
where = ["src"]
