name: Validate Project Orrery

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install reader dependencies
        run: python -m pip install -r skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt

      - name: Run portable installation tests
        env:
          ORRERY_TEST_BUILD: "1"
        run: python -m unittest discover -s tests -v
