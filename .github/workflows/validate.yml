name: Promotion validation

on:
  push:
    branches:
      - "promotion/**"
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Frozen non-main candidate branch or ref
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character commit SHA expected at candidate_ref
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: promotion inventory and exact-SHA preflight
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.inventory.outputs.lanes }}
      candidate_ref: ${{ steps.candidate.outputs.candidate_ref }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt
      - name: Install preflight discovery dependencies
        run: python -m pip install "wheel>=0.41,<1" -r skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt
      - name: Bind checkout to frozen candidate ref and SHA
        id: candidate
        shell: bash
        env:
          CANDIDATE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.ref }}
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
        run: |
          python scripts/ci/validate_ci.py --all --bind --candidate-ref "$CANDIDATE_REF" --candidate-sha "$CANDIDATE_SHA"
          echo "candidate_ref=$CANDIDATE_REF" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - name: Discover complete Promotion inventory
        id: inventory
        shell: bash
        run: |
          python scripts/ci/test_inventory.py --output "$RUNNER_TEMP/test-inventory.json"
          echo "lanes=$(python scripts/ci/test_inventory.py --lane-list)" >> "$GITHUB_OUTPUT"
      - name: Upload exact inventory
        uses: actions/upload-artifact@v4
        with:
          name: promotion-test-inventory
          path: ${{ runner.temp }}/test-inventory.json
          if-no-files-found: error

  windows-lanes:
    name: promotion lane windows-latest / ${{ matrix.lane }}
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        lane: ${{ fromJSON(needs.preflight.outputs.lanes) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt
      - name: Install test dependencies
        run: python -m pip install "wheel>=0.41,<1" -r skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt
      - name: Verify exact candidate checkout
        run: >-
          python scripts/ci/validate_ci.py --bind
          --candidate-ref "${{ needs.preflight.outputs.candidate_ref }}"
          --candidate-sha "${{ needs.preflight.outputs.candidate_sha }}"
      - name: Run complete Promotion lane
        env:
          ORRERY_TEST_BUILD: "1"
        run: >-
          python scripts/ci/run_test_lane.py --lane "${{ matrix.lane }}"
          --output-dir "${{ runner.temp }}/results-${{ matrix.lane }}"
      - name: Upload lane results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: promotion-windows-latest-${{ matrix.lane }}
          path: ${{ runner.temp }}/results-${{ matrix.lane }}
          if-no-files-found: error

  windows-gates:
    name: promotion repository gates / windows-latest
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt
      - name: Install test dependencies
        run: python -m pip install "wheel>=0.41,<1" -r skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt
      - name: Verify exact candidate checkout
        run: >-
          python scripts/ci/validate_ci.py --bind
          --candidate-ref "${{ needs.preflight.outputs.candidate_ref }}"
          --candidate-sha "${{ needs.preflight.outputs.candidate_sha }}"
      - name: Validate integrated structure
        run: python skills/project-orrery/scripts/validate_installation.py --target . --require-integrated
      - name: Build isolated docsite
        run: python scripts/docsite/build_docsite.py --out "${{ runner.temp }}/orrery-docsite.html"
      - name: Validate links and forbidden artifacts
        run: python scripts/ci/validate_repository_gates.py
      - name: Build release package without publishing
        run: python scripts/package_release.py --output-dir "${{ runner.temp }}/release-package"
      - name: Verify clean checkout diff
        run: git diff --check

  ubuntu-lanes:
    name: promotion lane ubuntu-latest / ${{ matrix.lane }}
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        lane: ${{ fromJSON(needs.preflight.outputs.lanes) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt
      - name: Install test dependencies
        run: python -m pip install "wheel>=0.41,<1" -r skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt
      - name: Verify exact candidate checkout
        run: >-
          python scripts/ci/validate_ci.py --bind
          --candidate-ref "${{ needs.preflight.outputs.candidate_ref }}"
          --candidate-sha "${{ needs.preflight.outputs.candidate_sha }}"
      - name: Run complete Promotion lane
        env:
          ORRERY_TEST_BUILD: "1"
        run: >-
          python scripts/ci/run_test_lane.py --lane "${{ matrix.lane }}"
          --output-dir "${{ runner.temp }}/results-${{ matrix.lane }}"
      - name: Upload lane results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: promotion-ubuntu-latest-${{ matrix.lane }}
          path: ${{ runner.temp }}/results-${{ matrix.lane }}
          if-no-files-found: error

  ubuntu-gates:
    name: promotion repository gates / ubuntu-latest
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt
      - name: Install test dependencies
        run: python -m pip install "wheel>=0.41,<1" -r skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt
      - name: Verify exact candidate checkout
        run: >-
          python scripts/ci/validate_ci.py --bind
          --candidate-ref "${{ needs.preflight.outputs.candidate_ref }}"
          --candidate-sha "${{ needs.preflight.outputs.candidate_sha }}"
      - name: Validate integrated structure
        run: python skills/project-orrery/scripts/validate_installation.py --target . --require-integrated
      - name: Build isolated docsite
        run: python scripts/docsite/build_docsite.py --out "${{ runner.temp }}/orrery-docsite.html"
      - name: Validate links and forbidden artifacts
        run: python scripts/ci/validate_repository_gates.py
      - name: Build release package without publishing
        run: python scripts/package_release.py --output-dir "${{ runner.temp }}/release-package"
      - name: Verify clean checkout diff
        run: git diff --check

  smoke-test-windows:
    name: smoke-test (windows-latest)
    if: ${{ always() }}
    needs: [preflight, windows-lanes, windows-gates]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt
      - name: Install aggregate discovery dependencies
        run: python -m pip install "wheel>=0.41,<1" -r skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: promotion-windows-latest-*
          path: ${{ runner.temp }}/promotion-results
      - name: Fail-closed aggregate
        run: >-
          python scripts/ci/aggregate_test_results.py
          --results-dir "${{ runner.temp }}/promotion-results"
          --expected-os Windows
          --expected-sha "${{ needs.preflight.outputs.candidate_sha }}"
          --matrix-result "${{ needs.windows-lanes.result }}"
          --gate-result "${{ needs.windows-gates.result }}"
          --output "${{ runner.temp }}/promotion-windows-latest.json"
      - name: Upload aggregate receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: promotion-aggregate-windows-latest
          path: ${{ runner.temp }}/promotion-windows-latest.json
          if-no-files-found: error

  smoke-test-ubuntu:
    name: smoke-test (ubuntu-latest)
    if: ${{ always() }}
    needs: [preflight, ubuntu-lanes, ubuntu-gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt
      - name: Install aggregate discovery dependencies
        run: python -m pip install "wheel>=0.41,<1" -r skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: promotion-ubuntu-latest-*
          path: ${{ runner.temp }}/promotion-results
      - name: Fail-closed aggregate
        run: >-
          python scripts/ci/aggregate_test_results.py
          --results-dir "${{ runner.temp }}/promotion-results"
          --expected-os Linux
          --expected-sha "${{ needs.preflight.outputs.candidate_sha }}"
          --matrix-result "${{ needs.ubuntu-lanes.result }}"
          --gate-result "${{ needs.ubuntu-gates.result }}"
          --output "${{ runner.temp }}/promotion-ubuntu-latest.json"
      - name: Upload aggregate receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: promotion-aggregate-ubuntu-latest
          path: ${{ runner.temp }}/promotion-ubuntu-latest.json
          if-no-files-found: error
