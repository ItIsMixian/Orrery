name: Verify Orrery Release Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-release-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test and reader dependencies
        run: python -m pip install "jsonschema>=4.18,<5" -r skills/project-orrery/assets/project-template/scripts/docsite/requirements.txt

      - name: Run portable installation tests
        env:
          ORRERY_TEST_BUILD: "1"
        run: python -m unittest discover -s tests -v

      - name: Package tagged Skill
        run: python scripts/package_release.py --source-sha "$GITHUB_SHA" --check-tag "$GITHUB_REF_NAME" --receipt-file "${RUNNER_TEMP}/orrery-entry-receipt.json"

      - name: Verify checksum
        shell: bash
        run: cd dist && sha256sum --check "project-orrery-${GITHUB_REF_NAME}.sha256"

      # Publishing the tag, ZIP/checksum pair, and GitHub Release is a separate
      # maintainer-authorized operation after exact-SHA Windows and Ubuntu PASS.
